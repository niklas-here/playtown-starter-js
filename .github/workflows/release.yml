# Builds the game when you push a tag such as v0.1.0, and attaches the export to a GitHub Release as
# playtown-export.zip (build.releaseAsset in playtown.json). In PlayTown Studio you then import the tag.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # The same checks as PlayTown's import. A failing check stops the release here.
      - run: npx playtown validate
      - run: zip -qr playtown-export.zip dist
      # The release text is what CHANGELOG.md says under the heading with the tag's name.
      - run: |
          # sed drops the empty lines before the first line of text.
          awk -v tag="## $GITHUB_REF_NAME" '$0 == tag { found = 1; next } /^## / { found = 0 } found' CHANGELOG.md | sed '/./,$!d' > release-notes.md
          [ -s release-notes.md ] || echo "Version $GITHUB_REF_NAME" > release-notes.md
          gh release create "$GITHUB_REF_NAME" playtown-export.zip --title "$GITHUB_REF_NAME" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
